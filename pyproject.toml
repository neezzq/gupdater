[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gupdater"
dynamic = ["version"]
description = "Автообновление игр в лаунчерах для компьютерного клуба"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gupdater = "gupdater.app:main"

[tool.setuptools.dynamic]
version = { attr = "gupdater.__version__" }

[tool.setuptools.packages.find]
include = ["gupdater*"]

[tool.setuptools.package-data]
gupdater = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
