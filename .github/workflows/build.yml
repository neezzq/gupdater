name: Build GUpdater.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # attach GUpdater.exe to a release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build GUpdater.exe
        run: pyinstaller --noconfirm --onefile --windowed --name GUpdater --paths . scripts/pyinstaller_entry.py

      - name: Check the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GUpdater.exe -ArgumentList "--report", "runner-report.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--report exited with $($p.ExitCode)" }
          if (-not (Test-Path runner-report.txt)) { throw "no report written" }
          Get-Content runner-report.txt -TotalCount 30
          # Opens the real window (native Windows plugin), scans demo data and closes.
          $p = Start-Process -FilePath dist\GUpdater.exe -ArgumentList "--demo", "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "window smoke test exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: GUpdater
          path: dist/GUpdater.exe

      - uses: actions/upload-artifact@v4
        with:
          name: runner-report
          path: runner-report.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GUpdater.exe
