name: Build GUpdater.exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write  # publish GUpdater.exe to Releases

# Two quick pushes must not publish over each other.
concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build GUpdater.exe
        run: pyinstaller --noconfirm --onefile --windowed --name GUpdater --paths . scripts/pyinstaller_entry.py

      - name: Check the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GUpdater.exe -ArgumentList "--report", "runner-report.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--report exited with $($p.ExitCode)" }
          if (-not (Test-Path runner-report.txt)) { throw "no report written" }
          Get-Content runner-report.txt -TotalCount 30
          # Opens the real window (native Windows plugin), scans demo data and closes.
          $p = Start-Process -FilePath dist\GUpdater.exe -ArgumentList "--demo", "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "window smoke test exited with $($p.ExitCode)" }

      - name: Check the autopilot in the built exe
        shell: pwsh
        run: |
          # A real run on this machine: no launchers here, so it must skip them all, write a report and quit.
          New-Item -ItemType Directory pilot | Out-Null
          Copy-Item dist\GUpdater.exe pilot\GUpdater.exe
          $p = Start-Process -FilePath pilot\GUpdater.exe -ArgumentList "--autopilot", "--now" -PassThru
          $p | Wait-Process -Timeout 180
          if (-not $p.HasExited) { $p | Stop-Process; throw "autopilot did not finish" }
          $report = Get-ChildItem pilot -Recurse -Filter "*.txt" | Select-Object -First 1
          if (-not $report) { throw "autopilot wrote no report" }
          Get-Content $report.FullName -TotalCount 20

      - name: Check updating the built exe in place
        shell: pwsh
        run: |
          New-Item -ItemType Directory upd | Out-Null
          Copy-Item dist\GUpdater.exe upd\GUpdater.exe
          Copy-Item dist\GUpdater.exe upd\new.exe
          $dir = (Resolve-Path upd).Path
          $p = Start-Process -FilePath upd\GUpdater.exe -ArgumentList "--selftest-update", "$dir\new.exe", "$dir\after-update.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--selftest-update exited with $($p.ExitCode)" }
          # The replaced exe restarts itself and writes a report.
          for ($i = 0; $i -lt 60 -and -not (Test-Path upd\after-update.txt); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path upd\after-update.txt)) { throw "the updated exe did not start" }
          if (Test-Path upd\new.exe) { throw "new.exe was not moved into place" }
          Get-ChildItem upd | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: GUpdater
          path: dist/GUpdater.exe

      - uses: actions/upload-artifact@v4
        with:
          name: runner-report
          path: runner-report.txt

      # One release per version (gupdater/__init__.py): every successful build
      # replaces GUpdater.exe in it, and bumping the version starts a new release.
      - name: Prepare release
        id: release
        shell: pwsh
        run: |
          $version = python -c "import gupdater; print(gupdater.__version__)"
          $tag = "v$version"
          git tag -f $tag $env:GITHUB_SHA
          git push -f origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "could not push tag $tag" }
          $notes = Get-Content RELEASE_NOTES.md -Raw -Encoding utf8
          $built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm")
          $notes += "`n---`nСборка $built UTC, коммит $env:GITHUB_SHA"
          Set-Content release-body.md $notes -Encoding utf8
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: GUpdater ${{ steps.release.outputs.version }}
          body_path: release-body.md
          files: dist/GUpdater.exe
          overwrite_files: true
          make_latest: true
